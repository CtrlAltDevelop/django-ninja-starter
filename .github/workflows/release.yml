# =============================================================================
# Release: build once, publish to PyPI with trusted publishing.
# =============================================================================
# Runs on a version tag. No API token exists anywhere: PyPI trusts this
# workflow's OIDC identity, configured once under the project's "Publishing"
# settings (owner CtrlAltDevelop, repo django-ninja-starter, workflow
# release.yml, environment pypi).
#
# The publish job lives in this file on purpose: PyPI's trusted publishing
# does not accept the same job run from the shared reusable workflow
# (CtrlAltDevelop/ci-workflows python-publish.yml); it fails with
# `invalid-publisher`, as it did for mdp-outbox v0.2.0.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/django_ninja_starter/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/django-ninja-starter/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload credential
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't fail on a re-run: files PyPI already has are skipped.
          skip-existing: true
