# Publishes the package to PyPI when a GitHub release is published.
#
# `v<version>` publishes that version. The tag check and the one-off PyPI
# setup live in CtrlAltDevelop/ci-workflows (python-publish.yml). PyPI trusts
# this file's name and the `pypi` environment, so keep both.

name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Release
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-publish.yml@v1.2.0
    permissions:
      contents: read
      id-token: write
    with:
      package-name: django-ninja-starter
      python-version: "3.12"
