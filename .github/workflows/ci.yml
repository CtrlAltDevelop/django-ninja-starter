# Runs the tests on a pull request into main — and on nothing else.
# The job lives once in CtrlAltDevelop/ci-workflows (python-test.yml).

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      python-version: "3.12"
      install: uv venv && uv pip install -e '.[dev]'
      test-command: uv run --no-sync make test

  # The wallet's row-lock tests need a real PostgreSQL; on SQLite they skip.
  locks:
    name: Row locks (PostgreSQL)
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      python-version: "3.12"
      postgres: true
      install: uv venv && uv pip install -e '.[dev]' 'psycopg[binary]'
      env: |
        DJANGO_DB_ENGINE=django.db.backends.postgresql
        DJANGO_DB_NAME=test_db
        DJANGO_DB_USER=test_user
        DJANGO_DB_PASSWORD=test_pass
        DJANGO_DB_HOST=localhost
        DJANGO_DB_PORT=5432
      test-command: |
        set -o pipefail
        uv run --no-sync pytest src/apps/wallet -p no:randomly --no-cov
        uv run --no-sync pytest src/apps/wallet/tests/test_concurrency.py -p no:randomly --no-cov -q | tee /tmp/locks.txt
        if grep -qi "skipped" /tmp/locks.txt; then
          echo "::error::the row-lock tests skipped, so nothing proved the locks work"
          exit 1
        fi
