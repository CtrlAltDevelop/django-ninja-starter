[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ninja-starter"
# Single-sourced from the package, so `--version` and the published metadata
# cannot drift apart.
dynamic = ["version"]
description = "A production-oriented Django Ninja API template and project generator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
  "django",
  "django-ninja",
  "api",
  "starter",
  "template",
  "authentication",
  "oauth",
  "jwt",
  "two-factor",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
  "Typing :: Typed",
]

# The generator itself is stdlib-only: it copies a tree and substitutes two
# placeholders. What a *generated* project needs is declared in the template's
# own pyproject, so installing this tool never drags in Django.
dependencies = []

[project.urls]
Homepage = "https://github.com/CtrlAltDevelop/django-ninja-starter"
Repository = "https://github.com/CtrlAltDevelop/django-ninja-starter"
Issues = "https://github.com/CtrlAltDevelop/django-ninja-starter/issues"
Changelog = "https://github.com/CtrlAltDevelop/django-ninja-starter/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CtrlAltDevelop/django-ninja-starter/tree/main/docs"

[project.scripts]
django-ninja-starter = "django_ninja_starter.cli:main"

[project.optional-dependencies]
dev = [
  "Django>=5.2,<7.0",
  "cryptography>=45,<48",
  "build>=1.2",
  "django-ninja>=1.4,<2.0",
  "django-socio-grpc>=0.25,<1.0",
  "django-unfold>=0.104,<1.0",
  "httpx>=0.28,<1.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-django>=4.11",
  "python-dotenv>=1.1,<2.0",
  "PyJWT>=2.10,<3.0",
  "pyotp>=2.9,<3.0",
  "redis>=5.0,<7.0",
  "fakeredis>=2.26,<3.0",
  "mypy-protobuf>=3.6",
  "ruff>=0.11",
  "strawberry-graphql-django>=0.88,<1.0",
  "twine>=6.0",
  "uvicorn>=0.52,<1.0",
  "websockets>=15,<18",
]

[tool.setuptools.dynamic]
version = { attr = "django_ninja_starter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_ninja_starter*"]

[tool.setuptools.package-data]
django_ninja_starter = ["py.typed", "template/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src", "tests"]
norecursedirs = ["src/django_ninja_starter/template"]
addopts = "--strict-markers --strict-config"
# The example-project tests each build a project and run a suite inside it.
# `pytest -m "not slow"` is the fast loop; CI and `make test` run everything.
markers = ["slow: builds an example project in a subprocess"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# Written by protoc, byte for byte, every time `manage.py protos` runs. Linting
# them would mean reformatting generated code that is regenerated on the next
# build -- and the .proto file, not the stub, is the thing to review.
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "*_pb2_grpc.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

# Migrations are written by `makemigrations`, not by hand. Their long lines are
# Django's own field help_text, reproduced verbatim; rewrapping them would only
# be undone the next time the file is regenerated.
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "django_ninja_starter", "infrastructure"]

[tool.mypy]
python_version = "3.12"
plugins = []
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# protoc writes these, and its `.pyi` stubs are still read for every import --
# they are just not held to this project's own strictness settings.
exclude = "_pb2(_grpc)?\\.pyi?$"
[[tool.mypy.overrides]]
module = ["django_socio_grpc.*", "grpc_tools.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "src/django_ninja_starter/__main__.py",
  "src/**/grpc/*_pb2.py",
  "src/**/grpc/*_pb2_grpc.py",
  "src/django_ninja_starter/template/**",
  "src/config/asgi.py",
  "src/config/wsgi.py",
  "src/config/settings/development.py",
  "src/config/settings/production.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
