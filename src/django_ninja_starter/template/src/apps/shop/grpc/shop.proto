syntax = "proto3";

package config.shop;

import "google/protobuf/empty.proto";

service ShopController {
    rpc AddAddress(AddAddressRequest) returns (AddressResult) {}
    rpc AddToCart(AddToCartRequest) returns (AddToCartResult) {}
    rpc Addresses(google.protobuf.Empty) returns (AddressList) {}
    rpc Brands(google.protobuf.Empty) returns (BrandList) {}
    rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResult) {}
    rpc Categories(google.protobuf.Empty) returns (CategoryList) {}
    rpc Category(CategoryRequest) returns (CategoryResult) {}
    rpc Checkout(CheckoutRequest) returns (CheckoutResult) {}
    rpc ClearCart(google.protobuf.Empty) returns (ClearCartResult) {}
    rpc Collection(CollectionRequest) returns (CollectionResult) {}
    rpc Collections(google.protobuf.Empty) returns (CollectionList) {}
    rpc ConfirmPayment(ConfirmPaymentRequest) returns (ConfirmPaymentResult) {}
    rpc DeleteReview(DeleteReviewRequest) returns (DeleteReviewResult) {}
    rpc Favourites(FavouritesRequest) returns (FavouritesResult) {}
    rpc GetAddress(GetAddressRequest) returns (GetAddressResult) {}
    rpc GetCart(google.protobuf.Empty) returns (CartResult) {}
    rpc Invoice(InvoiceRequest) returns (InvoiceResult) {}
    rpc LikeProduct(LikeProductRequest) returns (LikeResult) {}
    rpc Listing(ListingRequest) returns (ListingResult) {}
    rpc Listings(google.protobuf.Empty) returns (ListingList) {}
    rpc MyReviews(MyReviewsRequest) returns (MyReviewsResult) {}
    rpc Order(OrderRequest) returns (OrderResult) {}
    rpc Orders(OrdersRequest) returns (OrderList) {}
    rpc PreviewCoupon(CouponPreviewRequest) returns (CouponPreviewResult) {}
    rpc Product(ProductRequest) returns (ProductResult) {}
    rpc Products(ProductsRequest) returns (ProductsResult) {}
    rpc RecordView(RecordViewRequest) returns (RecordViewResult) {}
    rpc RelatedProducts(RelatedProductsRequest) returns (RelatedProductsResult) {}
    rpc RemoveAddress(RemoveAddressRequest) returns (AddressRemoved) {}
    rpc RemoveFromCart(RemoveFromCartRequest) returns (RemoveFromCartResult) {}
    rpc ReviewProduct(ReviewProductRequest) returns (ReviewProductResult) {}
    rpc Reviews(ReviewsRequest) returns (ReviewsResult) {}
    rpc Seller(SellerRequest) returns (SellerResult) {}
    rpc Sellers(google.protobuf.Empty) returns (SellerList) {}
    rpc SetCartQuantity(SetCartQuantityRequest) returns (SetCartQuantityResult) {}
    rpc SetDefaultAddress(AddressRequest) returns (DefaultAddressResult) {}
    rpc ShippingMethods(google.protobuf.Empty) returns (ShippingMethodList) {}
    rpc UnlikeProduct(UnlikeProductRequest) returns (UnlikeResult) {}
    rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResult) {}
}

message AddAddressRequest {
    string label = 1;
    string full_name = 2;
    string phone = 3;
    string country = 4;
    string province = 5;
    string city = 6;
    string postal_code = 7;
    string line1 = 8;
    string line2 = 9;
    bool is_default = 10;
}

message AddToCartRequest {
    string product = 1;
    string variant = 2;
    int32 quantity = 3;
    string offer = 4;
}

message AddToCartResult {
    Cart cart = 1;
}

message Address {
    string id = 1;
    string label = 2;
    string full_name = 3;
    string phone = 4;
    string country = 5;
    string province = 6;
    string city = 7;
    string postal_code = 8;
    string line1 = 9;
    string line2 = 10;
    bool is_default = 11;
    string created_at = 12;
    string updated_at = 13;
}

message AddressList {
    repeated Address addresses = 1;
}

message AddressRemoved {
    bool deleted = 1;
}

message AddressRequest {
    string address_id = 1;
}

message AddressResult {
    Address address = 1;
}

message Attribute {
    string code = 1;
    string name = 2;
    string type = 3;
    string unit = 4;
    repeated string choices = 5;
    bool required = 6;
    bool is_variant = 7;
    bool is_filterable = 8;
    string help_text = 9;
}

message Brand {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string logo = 5;
    string website = 6;
}

message BrandList {
    repeated Brand brands = 1;
}

message Breadcrumb {
    string name = 1;
    string slug = 2;
}

message CancelOrderRequest {
    string number = 1;
}

message CancelOrderResult {
    Order order = 1;
}

message Cart {
    string id = 1;
    string currency = 2;
    repeated CartItem items = 3;
    int32 item_count = 4;
    string subtotal = 5;
    string discount_total = 6;
    string total = 7;
    string updated_at = 8;
}

message CartItem {
    string id = 1;
    string product = 2;
    string name = 3;
    string image = 4;
    string variant = 5;
    string variant_label = 6;
    int32 quantity = 7;
    Price unit_price = 8;
    string line_total = 9;
    bool in_stock = 10;
    string offer = 11;
    string seller = 12;
}

message CartResult {
    Cart cart = 1;
}

message CategoryDetail {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string image = 5;
    string icon = 6;
    string parent = 7;
    int32 product_count = 8;
    repeated Breadcrumb breadcrumbs = 9;
    repeated CategorySummary children = 10;
    repeated Attribute attributes = 11;
    SeoMeta meta = 12;
}

message CategoryList {
    repeated CategorySummary categories = 1;
}

message CategoryRequest {
    string slug = 1;
}

message CategoryResult {
    CategoryDetail category = 1;
}

message CategorySummary {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string image = 5;
    string icon = 6;
    string parent = 7;
    int32 product_count = 8;
}

message CheckoutRequest {
    string address_id = 1;
    string shipping_method_id = 2;
    string coupon = 3;
    string note = 4;
}

message CheckoutResult {
    Order order = 1;
}

message ClearCartResult {
    Cart cart = 1;
}

message Collection {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string image = 5;
    repeated ProductSummary products = 6;
}

message CollectionList {
    repeated CollectionSummary collections = 1;
}

message CollectionRequest {
    string slug = 1;
    int32 limit = 2;
}

message CollectionResult {
    Collection collection = 1;
}

message CollectionSummary {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string image = 5;
}

message ConfirmPaymentRequest {
    string number = 1;
    string reference = 2;
}

message ConfirmPaymentResult {
    Order order = 1;
}

message CouponPreview {
    string code = 1;
    bool is_valid = 2;
    string reason = 3;
    string discount = 4;
    string subtotal = 5;
    string total = 6;
    string currency = 7;
}

message CouponPreviewRequest {
    string code = 1;
}

message CouponPreviewResult {
    CouponPreview preview = 1;
}

message DefaultAddressResult {
    Address address = 1;
}

message DeleteReviewRequest {
    string slug = 1;
}

message DeleteReviewResult {
    string product = 1;
    string rating_average = 2;
    int32 rating_count = 3;
}

message FavouritesRequest {
    int32 limit = 1;
    int32 offset = 2;
}

message FavouritesResult {
    ProductPage page = 1;
}

message GetAddressRequest {
    string address_id = 1;
}

message GetAddressResult {
    Address address = 1;
}

message Invoice {
    string number = 1;
    string issued_at = 2;
    string due_at = 3;
    string notes = 4;
    Order order = 5;
}

message InvoiceRequest {
    string number = 1;
}

message InvoiceResult {
    Invoice invoice = 1;
}

message LikeProductRequest {
    string slug = 1;
}

message LikeResult {
    string product = 1;
    bool liked = 2;
    int32 like_count = 3;
}

message ListingList {
    repeated ListingSummary listings = 1;
}

message ListingRequest {
    string key = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ListingResult {
    string key = 1;
    string name = 2;
    string description = 3;
    ProductPage page = 4;
}

message ListingSummary {
    string key = 1;
    string name = 2;
    string description = 3;
}

message MyReviewsRequest {
    int32 limit = 1;
    int32 offset = 2;
}

message MyReviewsResult {
    ReviewPage page = 1;
}

message Offer {
    string id = 1;
    Seller seller = 2;
    string variant = 3;
    string sku = 4;
    string condition = 5;
    int32 lead_time_days = 6;
    int32 stock = 7;
    bool in_stock = 8;
    Price price = 9;
}

message OptionValue {
    string value = 1;
    bool in_stock = 2;
    repeated string variants = 3;
}

message Order {
    string number = 1;
    string status = 2;
    string status_label = 3;
    string currency = 4;
    string placed_at = 5;
    repeated OrderLine items = 6;
    string subtotal = 7;
    string coupon = 8;
    string coupon_discount = 9;
    string shipping_method = 10;
    string shipping_total = 11;
    string tax_total = 12;
    string total = 13;
    string note = 14;
    string payment_status = 15;
    string invoice = 16;
    string carrier = 17;
    string tracking_number = 18;
    string tracking_url = 19;
    string shipped_at = 20;
    repeated OrderEvent history = 21;
}

message OrderEvent {
    string status = 1;
    string status_label = 2;
    string note = 3;
    string at = 4;
}

message OrderLine {
    string product = 1;
    string name = 2;
    string seller = 3;
    string sku = 4;
    int32 quantity = 5;
    string unit_price = 6;
    string tax_rate = 7;
    string line_total = 8;
}

message OrderList {
    repeated Order orders = 1;
    int32 total = 2;
}

message OrderRequest {
    string number = 1;
}

message OrderResult {
    Order order = 1;
}

message OrdersRequest {
    int32 limit = 1;
    int32 offset = 2;
}

message Price {
    string amount = 1;
    string base_amount = 2;
    string currency = 3;
    bool is_discounted = 4;
    string discount_id = 5;
    string discount_name = 6;
    string discount_kind = 7;
    string discount_value = 8;
    string discount_amount_off = 9;
    int32 discount_percent_off = 10;
    string discount_ends_at = 11;
}

message ProductAttributeValue {
    string code = 1;
    string name = 2;
    string type = 3;
    string unit = 4;
    string value_json = 5;
}

message ProductDetail {
    string id = 1;
    string slug = 2;
    string name = 3;
    string subtitle = 4;
    string summary = 5;
    string image = 6;
    string brand = 7;
    string brand_slug = 8;
    string seller = 9;
    string seller_slug = 10;
    string category = 11;
    string category_name = 12;
    Price price = 13;
    string compare_at_price = 14;
    bool in_stock = 15;
    bool has_variants = 16;
    bool is_featured = 17;
    string rating_average = 18;
    int32 rating_count = 19;
    int32 like_count = 20;
    int32 sales_count = 21;
    repeated string tags = 22;
    string created_at = 23;
    Seller sold_by = 24;
    string description = 25;
    string sku = 26;
    string barcode = 27;
    string tax_rate = 28;
    string status = 29;
    string published_at = 30;
    int32 stock = 31;
    bool track_inventory = 32;
    bool allow_backorder = 33;
    int32 weight_grams = 34;
    int32 length_mm = 35;
    int32 width_mm = 36;
    int32 height_mm = 37;
    repeated ProductImage images = 38;
    repeated ProductAttributeValue attributes = 39;
    repeated VariantAttribute variant_attributes = 40;
    repeated Variant variants = 41;
    repeated Breadcrumb breadcrumbs = 42;
    SeoMeta meta = 43;
    bool liked = 44;
    Review own_review = 45;
    repeated Offer offers = 46;
    int32 seller_count = 47;
}

message ProductImage {
    string url = 1;
    string alt = 2;
    string caption = 3;
    bool is_primary = 4;
}

message ProductPage {
    repeated ProductSummary items = 1;
    int32 total = 2;
    int32 limit = 3;
    int32 offset = 4;
}

message ProductRequest {
    string slug = 1;
}

message ProductResult {
    ProductDetail product = 1;
}

message ProductSummary {
    string id = 1;
    string slug = 2;
    string name = 3;
    string subtitle = 4;
    string summary = 5;
    string image = 6;
    string brand = 7;
    string brand_slug = 8;
    string category = 9;
    string category_name = 10;
    Price price = 11;
    string compare_at_price = 12;
    bool in_stock = 13;
    bool has_variants = 14;
    bool is_featured = 15;
    string rating_average = 16;
    int32 rating_count = 17;
    int32 like_count = 18;
    int32 sales_count = 19;
    repeated string tags = 20;
    string created_at = 21;
    string seller = 22;
    string seller_slug = 23;
}

message ProductsRequest {
    string search = 1;
    string category = 2;
    string sort = 3;
    int32 limit = 4;
    int32 offset = 5;
    string seller = 6;
    string brand = 7;
    string tag = 8;
    string min_price = 9;
    string max_price = 10;
    int32 min_rating = 11;
    bool in_stock = 12;
    bool on_sale = 13;
    bool featured = 14;
    repeated string attributes = 15;
}

message ProductsResult {
    ProductPage page = 1;
}

message RecordViewRequest {
    string slug = 1;
}

message RecordViewResult {
    string product = 1;
    int32 view_count = 2;
}

message RelatedProductsRequest {
    string slug = 1;
    int32 limit = 2;
}

message RelatedProductsResult {
    repeated ProductSummary products = 1;
}

message RemoveAddressRequest {
    string address_id = 1;
}

message RemoveFromCartRequest {
    string item_id = 1;
}

message RemoveFromCartResult {
    Cart cart = 1;
}

message Review {
    string id = 1;
    string product = 2;
    string author = 3;
    int32 rating = 4;
    string title = 5;
    string body = 6;
    string status = 7;
    string created_at = 8;
    string updated_at = 9;
}

message ReviewPage {
    repeated Review items = 1;
    int32 total = 2;
    int32 limit = 3;
    int32 offset = 4;
    optional string rating_average = 5;
    optional int32 rating_count = 6;
}

message ReviewProductRequest {
    string slug = 1;
    int32 rating = 2;
    string title = 3;
    string body = 4;
}

message ReviewProductResult {
    Review review = 1;
}

message ReviewsRequest {
    string slug = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ReviewsResult {
    ReviewPage page = 1;
}

message Seller {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string logo = 5;
    string city = 6;
    int32 product_count = 7;
}

message SellerList {
    repeated Seller sellers = 1;
}

message SellerRequest {
    string slug = 1;
}

message SellerResult {
    Seller seller = 1;
}

message SeoMeta {
    string title = 1;
    string description = 2;
    repeated string keywords = 3;
}

message SetCartQuantityRequest {
    string item_id = 1;
    int32 quantity = 2;
}

message SetCartQuantityResult {
    Cart cart = 1;
}

message ShippingMethod {
    string id = 1;
    string name = 2;
    string description = 3;
    string price = 4;
    string cost = 5;
    bool is_free = 6;
    string free_from = 7;
    int32 min_days = 8;
    int32 max_days = 9;
    string currency = 10;
}

message ShippingMethodList {
    repeated ShippingMethod methods = 1;
}

message UnlikeProductRequest {
    string slug = 1;
}

message UnlikeResult {
    string product = 1;
    bool liked = 2;
    int32 like_count = 3;
}

message UpdateAddressRequest {
    string address_id = 1;
    string label = 2;
    string full_name = 3;
    string phone = 4;
    string country = 5;
    string province = 6;
    string city = 7;
    string postal_code = 8;
    string line1 = 9;
    string line2 = 10;
}

message UpdateAddressResult {
    Address address = 1;
}

message Variant {
    string id = 1;
    string sku = 2;
    string label = 3;
    string options_json = 4;
    string image = 5;
    int32 stock = 6;
    bool in_stock = 7;
    Price price = 8;
    int32 total_stock = 9;
    repeated Offer sellers = 10;
    int32 seller_count = 11;
}

message VariantAttribute {
    string code = 1;
    string name = 2;
    string type = 3;
    string unit = 4;
    repeated string choices = 5;
    bool required = 6;
    bool is_variant = 7;
    bool is_filterable = 8;
    string help_text = 9;
    repeated OptionValue values = 10;
}

