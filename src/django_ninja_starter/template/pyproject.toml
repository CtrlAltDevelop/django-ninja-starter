[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "A production-oriented Django Ninja API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<48",
  "Django>=5.2,<7.0",
  "django-ninja>=1.4,<2.0",
  "httpx>=0.28,<1.0",
  "PyJWT>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-django>=4.11",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "infrastructure"]

[tool.mypy]
python_version = "3.12"
plugins = []
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "src/config/asgi.py",
  "src/config/wsgi.py",
  "src/config/settings/development.py",
  "src/config/settings/production.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
