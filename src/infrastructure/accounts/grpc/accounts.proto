syntax = "proto3";

package config.accounts;

import "google/protobuf/empty.proto";

service AccountController {
    rpc Me(google.protobuf.Empty) returns (Account) {}
    rpc UpdateProfile(ProfileUpdate) returns (Account) {}
}

message Account {
    string id = 1;
    string username = 2;
    string email = 3;
    bool email_verified = 4;
    bool is_active = 5;
    bool is_staff = 6;
    string date_joined = 7;
    string last_login = 8;
    Profile profile = 9;
}

message Profile {
    string display_name = 1;
    string avatar_url = 2;
    string bio = 3;
    string locale = 4;
    string timezone = 5;
    string date_of_birth = 6;
    bool marketing_opt_in = 7;
}

message ProfileUpdate {
    optional string display_name = 1;
    optional string avatar_url = 2;
    optional string bio = 3;
    optional string locale = 4;
    optional string timezone = 5;
    optional string date_of_birth = 6;
    optional bool marketing_opt_in = 7;
}

