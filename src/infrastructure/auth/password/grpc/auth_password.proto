syntax = "proto3";

package config.auth_password;

service PasswordController {
    rpc Change(ChangeRequest) returns (Message) {}
    rpc Forgot(ForgotRequest) returns (ResetTicket) {}
    rpc Login(LoginRequest) returns (LoginResult) {}
    rpc Logout(LogoutRequest) returns (Message) {}
    rpc Reset(ResetRequest) returns (Message) {}
    rpc Signup(SignupRequest) returns (LoginResult) {}
}

message ChangeRequest {
    string current_password = 1;
    string new_password = 2;
}

message Credentials {
    string token_type = 1;
    string access_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
    string session_id = 5;
}

message ForgotRequest {
    string email = 1;
}

message LoginRequest {
    string identifier = 1;
    string password = 2;
}

message LoginResult {
    bool requires_second_factor = 1;
    Credentials credentials = 2;
    string login_ticket = 3;
    repeated string methods = 4;
}

message LogoutRequest {
    string token = 1;
}

message Message {
    string detail = 1;
}

message ResetRequest {
    string ticket = 1;
    string code = 2;
    string password = 3;
}

message ResetTicket {
    string detail = 1;
    string ticket = 2;
    int32 expires_in = 3;
}

message SignupRequest {
    string identifier = 1;
    string password = 2;
    string email = 3;
}

